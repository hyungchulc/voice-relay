name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: voice-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test
        run: ./build.sh
